name: Linux CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.tcp_backend }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        tcp_backend:
          - epoll
          - io_uring

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes protobuf-compiler libprotobuf-dev
          if [ "${{ matrix.tcp_backend }}" = "io_uring" ]; then
            sudo apt-get install --yes liburing-dev
          fi

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DMINIRPC_BUILD_EXAMPLES=ON
          -DMINIRPC_BUILD_TESTS=ON
          -DMINIRPC_BUILD_BENCHMARKS=ON
          -DMINIRPC_TCP_SERVER_BACKEND=${{ matrix.tcp_backend }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
